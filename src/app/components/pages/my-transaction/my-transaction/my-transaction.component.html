<div class="content bg-gray-3">
    <div class="container-fluid px-2 px-md-5 pb-2 pt-4 py-md-4">
        <uni-image-card title="Transacciones de {{this.personName}}">
        </uni-image-card>


        <mat-card>
            <h2 style="margin-top: 23px; margin-left: 20px;"> Datos de Búsqueda </h2>

            <form [formGroup]="formDate" class="d-flex  flex-wrap">
                <mat-form-field appearance="outline" class="col-md-3">
                    <mat-label>Seleccionar fecha</mat-label>
                    <mat-date-range-input [rangePicker]="picker">
                        <input matStartDate formControlName="dateStart" placeholder="Start date">
                        <input matEndDate formControlName="dateEnd" placeholder="End date">
                    </mat-date-range-input>
                    <mat-hint align="end">MM/DD/YYYY - MM/DD/YYYY</mat-hint>
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-date-range-picker #picker></mat-date-range-picker>
                </mat-form-field>

                <mat-form-field appearance="outline" class="col-md-3">
                    <mat-label>Categoria de Servicio</mat-label>
                    <mat-select formControlName="category" (selectionChange)="selectCategory()">
                        <mat-option [value]="">NINGUNO</mat-option>
                        <mat-option *ngFor="let category of categoryTypes" [value]="category.master_name">
                            {{category.master_name}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="col-md-3" (click)="showAlarmSelectCategory()">
                    <mat-label>Seleccionar Servicio</mat-label>
                    <mat-select formControlName="idService" multiple (selectionChange)="onServicesChange($event)">

                        <!-- Input de búsqueda -->
                        <mat-option disabled class="search-option" *ngIf="selectedCategory">
                            <input matInput placeholder="Buscar servicio..." [(ngModel)]="serviceFilter"
                                [ngModelOptions]="{standalone: true}" (ngModelChange)="filterServices()"
                                (click)="$event.stopPropagation()" (keydown.space)="$event.stopPropagation()"
                                (keydown.enter)="$event.stopPropagation()" />
                        </mat-option>

                        <!-- Input de Listado de Servicios Listados-->
                        <mat-option disabled *ngIf="selectedCategory">
                            <input matInput placeholder="Servicios Listados..." [value]="servicesNames" />
                        </mat-option>

                        <!-- Mostrar los servicios filtrados -->
                        <mat-option *ngFor="let service of filteredServices" [value]="service.id">
                            {{ service.name }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="col-md-3">
                    <mat-label>Numero de Suministro</mat-label>
                    <input formControlName="supply" type="text" matInput>
                </mat-form-field>
                <mat-form-field appearance="outline" class="col-md-3">
                    <mat-label>Recibo</mat-label>
                    <input formControlName="numDoc" type="text" matInput>
                </mat-form-field>

                <mat-form-field appearance="outline" class="col-md-3">
                    <mat-label>Estado de Transferencia</mat-label>
                    <mat-select formControlName="status" multiple>
                        <mat-option *ngFor="let status of masterStatus" [value]="status.master_name">
                            {{status.master_name}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
                <mat-form-field appearance="outline" class="col-md-3">
                    <mat-label>Estado de Conciliacion</mat-label>
                    <mat-select formControlName="statusConc">
                        <mat-option [value]="">NINGUNO</mat-option>
                        <mat-option *ngFor="let status of masterStatusConc" [value]="status">
                            {{status}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </form>
            <div class="row">
                <div class="col lg-6 d-flex justify-content-end align-items-end mb-3 mr-3">
                    <button type="button" class="btn-default2 btn" (click)="clearSearch()">
                        <mat-icon>filter_alt_off</mat-icon>
                        Limpiar
                    </button>
                    <button type="button" class="btn-default3 btn" (click)="search()">
                        <mat-icon>search</mat-icon>
                        Buscar
                    </button>

                </div>
            </div>
        </mat-card>

        <mat-card>
            <uni-dynamic-table [columns]="columns" [data]="dataTransaction" [actionsOptions]="true"
                [lengthTable]="count" [refreshFunction]="reload.bind(this)" element_id="concep"
                (pageChange)="onPageChange($event)" [pageKey]="pageKey">

            </uni-dynamic-table>

        </mat-card>
    </div>
</div>
