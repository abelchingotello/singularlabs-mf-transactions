<div class="content bg-gray-3">
    <div class="container-fluid px-2 px-md-5 pb-2 pt-4 py-md-4">
        <uni-image-card title="Transacciones">
        </uni-image-card>


        <mat-card class="custom-border-radius-1-25 p-3">
            <h2> Datos de Búsqueda </h2>

            <form [formGroup]="formDate" class="row">

                <mat-form-field appearance="outline" class="col-md-3">
                    <mat-label>Seleccionar fecha</mat-label>
                    <mat-date-range-input [rangePicker]="picker">
                        <input matStartDate formControlName="dateStart" placeholder="Start date">
                        <input matEndDate formControlName="dateEnd" placeholder="End date">
                    </mat-date-range-input>
                    <mat-hint align="end">MM/DD/YYYY – MM/DD/YYYY</mat-hint>
                    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-date-range-picker #picker></mat-date-range-picker>

                    <!-- <mat-error *ngIf="formDate.controls.start.hasError('matStartDateInvalid')">Invalid start date</mat-error>
                    <mat-error *ngIf="range.controls.end.hasError('matEndDateInvalid')">Invalid end date</mat-error> -->
                </mat-form-field>

                <mat-form-field appearance="outline" class="col-md-3">
                    <mat-label>Seleccionar servicio</mat-label>
                    <mat-select formControlName="idService">
                        <mat-option [value]="">NINGUNO</mat-option>
                        <mat-option *ngFor="let service of serviceName" [value]="service.id">
                            {{service.name}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" class="col-md-3">
                    <mat-label>N° documento</mat-label>
                    <input formControlName="numDoc" type="text" matInput>
                </mat-form-field>

                <mat-form-field appearance="outline" class="col-md-3">
                    <mat-label>Seleccionar Estado</mat-label>
                    <mat-select formControlName="status">
                        <mat-option [value]="">NINGUNO</mat-option>
                        <mat-option *ngFor="let status of masterStatus" [value]="status.master_name">
                            {{status.master_name}}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </form>
        </mat-card>
        <mat-card class="custom-border-radius-1-25">
            <uni-dynamic-table [columns]="columns" [data]="dataTransaction" [lengthTable]="count"
                [refreshFunction]="reload.bind(this)" element_id="concep" (pageChange)="onPageChange($event)"
                [pageKey]="pageKey" [actionsOptions]="false">
            </uni-dynamic-table>
        </mat-card>

    </div>
</div>
